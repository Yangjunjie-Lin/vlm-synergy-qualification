schema_version: 1
frozen_before_new_model_load_attempts: true
evidence_source: artifacts/manifests/engineering_smoke.json
formal_task_outputs_at_diagnosis: 0
shared_old_path:
  quantization: 4-bit NF4 with double quantization
  device_map: auto
  cpu_offload_flag: llm_int8_enable_fp32_cpu_offload=true
  offload_state_dict: true
  loader: generic AutoModel class selection
  status: UNVERIFIED_AS_4BIT_CPU_OFFLOAD
models:
  qwen2_5_vl_7b:
    family: Qwen2.5-VL
    original_failure: Tensor.item() cannot be called on meta tensors
    observed_path:
      - 4-bit NF4
      - device_map=auto
      - GPU/CPU offload
      - bitsandbytes quant_state serialization
      - Accelerate hook attachment
    actual_root_cause: QUANTIZED_AUTO_OFFLOAD_META_QUANT_STATE
    traceback_terminal_path:
      - accelerate.big_modeling.dispatch_model
      - accelerate.hooks.attach_align_device_hook_on_blocks
      - torch.nn.Module.state_dict
      - bitsandbytes.nn.modules._save_to_state_dict
      - bitsandbytes.functional.QuantState.as_dict
      - quant_state.offset.item
      - torch.meta_local_scalar_dense
    old_attempts:
      attempt_1: generic 4-bit auto GPU/CPU offload with 4600 MiB GPU max memory
      attempt_2: generic 4-bit auto GPU/CPU offload with 4100 MiB GPU max memory
      root_cause_mechanism_changed: false
      assessment: >-
        Attempt 2 changed only max_memory and the offload folder. It did not change
        quantization or offload mechanism and therefore was not a root-cause repair.
    recovery_action:
      native_class: Qwen2_5_VLForConditionalGeneration
      primary: 4-bit GPU-only placement on one CUDA device, no CPU or disk auto-offload
