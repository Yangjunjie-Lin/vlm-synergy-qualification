    action: enforce injective names for distinct entity identities, not unique occurrences of the same entity name
  - issue: naming_bridge_image_objects_would_change_frozen_construct
    action: unique internal aliases; retain unlabeled descriptor-selected image objects
  - issue: full_question_and_metadata_include_legitimate_evidence_and_answers
    action: freeze explicit evidence-free shortcut feature allowlists; retain unconditional train-only classifiers and all OOF predictions
  - issue: shortcut_scope_not_separately_specified_per_task
    action: freeze each shortcut pooled256 OOF hardgate before data generation; disclose per-task diagnostics; additional binding descriptor64 gate
  - issue: old_text_tasks_used_matched_decorative_images
    action: create fresh blank provenance files but send no image tensors, satisfying explicit v2 text-only renderer gate
  - issue: Joint_diagnostic_YAML_and_old_statistical_implementation_differ
    action: preserve old statistical implementation and all numeric thresholds exactly; no post-outcome reinterpretation
  - issue: legacy_verify_commands_rewrite_historical_manifests
    action: v2 command dispatch uses read-only verification of all674 protected files, old annotated tags and actual prediction hashes
